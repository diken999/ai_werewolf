[project]
name = "ai-werewolf"
version = "0.1.0"
description = "最小规则 AI 狼人杀（LangGraph 多 Agent 骨架）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.11",
    "langchain-deepseek>=1.1.0",
    "langgraph>=1.0.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.0",
]

[project.scripts]
ai-werewolf = "ai_werewolf.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_werewolf"]
